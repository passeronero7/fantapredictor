[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantapredictor"
description = "Evidence-led probabilistic prediction and research engine for Serie A Fantacalcio."
readme = "README.md"
requires-python = ">=3.11"
# Single source of truth for the schema+ingestion version. Bump the minor on
# every backwards-compatible data-layer change, the major on breaking schema
# changes. Keep in sync with src/db/__init__.py::__version__ and the
# CHANGELOG.md [Unreleased] section.
version = "0.3.0"

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
